# middlewares.yml
# 
# Updated: 2026 May 26
http:
  middlewares:
    auth-proxy:
      forwardAuth:
        address: http://authentik_server:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-entitlements
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version

    rate-limit-Global:
      rateLimit:
        average: 100
        burst: 200
        period: 1s
    rate-limit-navidrome:
      rateLimit:
        average: 20
        burst: 50

    secure-headers:
      headers:
        sslRedirect: true
        stsSeconds: 31536000
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true

